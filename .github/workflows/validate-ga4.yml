name: Validate GA4 integration
on:
  push:
    branches: [feature/ga4-tracking]
    paths:
      - 'components/Analytics.tsx'
      - 'app/layout.tsx'
      - '.github/workflows/validate-ga4.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
