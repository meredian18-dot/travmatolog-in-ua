name: Verify SEO build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check static locale output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for lang in ['uk','en','de','pl']:
              p=Path('out')/lang/'index.html'
              print(lang, 'exists', p.exists())
              if not p.exists(): raise SystemExit(1)
              html=p.read_text()
              import re
              checks={'language':bool(re.search(r'<html[^>]*lang="'+lang+'"',html)),
                      'canonical':'rel="canonical"' in html,
                      'hreflang':'hreflang=' in html.lower()}
              print(checks)
              if not all(checks.values()):
                  print('head excerpt:', html[:4000])
                  raise SystemExit(1)
          for path in ['out/sitemap.xml','out/robots.txt']:
              print(path,Path(path).exists())
              assert Path(path).exists()
          PY
