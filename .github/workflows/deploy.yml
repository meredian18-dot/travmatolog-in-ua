name: Deploy to GitHub Pages
# Uses the configured GitHub Actions Pages source; no DNS changes.
# Redeploy trigger: refresh published site after hip/knee regional guidance.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build static site
        run: npm run build
        # No NEXT_PUBLIC_BASE_PATH: the site is served at the root of the
        # custom domain (see public/CNAME), not under /<repo>.

      - name: Keep custom domain in deployment artifact
        run: cp public/CNAME out/CNAME

      - name: Disable Jekyll (keep _next assets)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
